services:
  db:
    image: postgres:17-alpine
    container_name: dealflow360-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dealflow360
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dealflow360"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
